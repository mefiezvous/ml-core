# MLC-010: Dependabot keeps pip deps and GitHub Actions SHAs current.
version: 2

updates:
  # Python (pip / uv) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions (keeps pinned SHAs up-to-date, pairs with MLC-004)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
