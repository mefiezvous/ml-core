[project]
name = "ml-core"
version = "0.1.0"
description = "Generic ML training and evaluation for robotics policies"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Arthur Mouraud", email = "mouraud.arthur@gmail.com" }]

dependencies = [
    "lerobot==0.5.1",
    "hydra-core==1.3.2",
    "mlflow==3.12.0",
    "loguru>=0.7.3",
    "numpy>=1.26",
    # Transitive bumps for CVE remediation (audited 2026-06-04)
    "aiohttp>=3.14.1",       # CVE-2026-34993, CVE-2026-47265
    # starlette PYSEC-2026-161: mlflow==3.12.0 pins starlette<1, blocking
    # the bump to 1.0.1. Ignored in CI until mlflow supports starlette>=1.
    # diffusers PYSEC-2026-40/41 + CVE-2026-45804: lerobot==0.5.1 pins
    # diffusers<0.36, blocking the bump to 0.38.0. Ignored in CI until
    # lerobot supports a newer diffusers; revisit at next lerobot upgrade.
    # torch PYSEC-2026-139: no fix version available yet (2026-06-04);
    # ignored in CI until upstream publishes a patched release.
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-cov>=5", "ruff>=0.15.16", "mypy>=2.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlcore"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["lerobot.*", "mlflow.*", "omegaconf.*", "hydra.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/mlcore --cov-report=term-missing --cov-fail-under=60"
markers = [
    "unit: fast unit tests without GPU",
    "gpu: tests requiring GPU",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
