[project]
name = "ml-core"
version = "0.1.0"
description = "Generic ML training and evaluation for robotics policies"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Arthur Mouraud", email = "mouraud.arthur@gmail.com" }]

dependencies = [
    "lerobot==0.5.1",
    "hydra-core==1.3.2",
    "mlflow==3.12.0",
    "loguru>=0.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlcore"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["lerobot.*", "mlflow.*", "omegaconf.*", "hydra.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/mlcore --cov-report=term-missing --cov-fail-under=60"
markers = [
    "unit: fast unit tests without GPU",
    "gpu: tests requiring GPU",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
